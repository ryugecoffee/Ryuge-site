name: Inventory tests (no payment credentials)
on:
  push:
    branches:
      - feature/stripe-inventory-preview-20261113
  pull_request:
    paths:
      - 'server/inventory.js'
      - 'server/catalog.js'
      - 'server/orders.js'
      - 'server/orders.test.js'
      - 'server/inventory-launch.test.js'
      - 'server/quote.js'
      - 'server/promo.js'
      - 'server/promo.test.js'
      - 'server/brazil-lot.test.js'
      - 'server/initial-stock.js'
      - 'server/refunds.js'
      - 'server/factory-refund-api.js'
      - 'server/factory-refund-api.test.js'
      - 'server/refunds.test.js'
      - 'docs/refunds.md'
      - 'server/initial-stock.test.js'
      - 'server/product-detail.test.js'
      - 'api/coffee-concierge.js'
      - 'api/create-subscription-checkout.js'
      - 'server/subscriptions-paused.test.js'
      - 'src/CartContext.jsx'
      - 'server/quote.test.js'
      - 'server/international-rates.js'
      - 'server/checkout-policy.test.js'
      - 'src/lib/shippingPolicy.js'
      - 'src/pages/ShippingPage.jsx'
      - 'src/components/SiteLayout.jsx'
      - 'src/App.jsx'
      - 'docs/international-shipping.md'
      - 'server/catalog.test.js'
      - 'src/productData.js'
      - 'src/pages/CheckoutPage.jsx'
      - 'server/factory-inventory-api.js'
      - 'server/factory-inventory-api.test.js'
      - 'server/firestore-preview-checkout.js'
      - 'server/firestore-preview-checkout.test.js'
      - 'server/inventory-adjustments.js'
      - 'server/inventory-adjustments.test.js'
      - 'server/inventory-firestore-emulator.test.js'
      - 'server/rate-limit.js'
      - 'server/rate-limit.test.js'
      - 'server/package.json'
      - 'server/package-lock.json'
      - 'eslint.config.js'
      - 'src/App.css'
      - 'server/inventory.test.js'
      - 'server/inventory-scenarios.test.js'
      - 'server/index.js'
      - 'server/resp-client.js'
      - 'server/sandbox-checkout.js'
      - 'server/staging-entry.js'
      - 'src/pages/ProductsPage.jsx'
      - '.github/workflows/inventory-tests.yml'
permissions:
  contents: read
jobs:
  test-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check server/inventory.js
          node --check server/catalog.js
          node --check server/initial-stock.js
          node --check server/refunds.js
          node --check server/factory-refund-api.js
          node --check server/orders.js
          node --check server/quote.js
          node --check server/promo.js
          node --check server/international-rates.js
          node --check server/factory-inventory-api.js
          node --check server/factory-inventory-api.test.js
          node --check server/firestore-preview-checkout.js
          node --check server/firestore-preview-checkout.test.js
          node --check server/inventory-adjustments.js
          node --check server/index.js
          node --check server/resp-client.js
          node --check server/sandbox-checkout.js
          node --check server/staging-entry.js
          node --check server/inventory-firestore-emulator.test.js
          node --check server/rate-limit.js
      - name: Install site dependencies
        run: npm ci
      - name: Install payment server dependencies
        run: npm ci --prefix server
      - name: Lint inventory and sandbox payment code
        run: >
          npx eslint server/inventory.js server/catalog.js server/initial-stock.js server/refunds.js server/factory-refund-api.js server/orders.js server/quote.js server/promo.js server/international-rates.js src/lib/shippingPolicy.js src/pages/CheckoutPage.jsx server/inventory-adjustments.js
          server/factory-inventory-api.js server/firestore-preview-checkout.js
          server/sandbox-checkout.js server/staging-entry.js server/resp-client.js server/rate-limit.js
          server/*.test.js
      - name: Build site preview
        run: npm run build
      - name: Unit tests
        run: node --test server/catalog.test.js server/orders.test.js server/inventory-launch.test.js server/quote.test.js server/checkout-policy.test.js server/promo.test.js server/brazil-lot.test.js server/initial-stock.test.js server/refunds.test.js server/factory-refund-api.test.js server/subscriptions-paused.test.js server/coffee-subscription.test.js server/store-cards.test.js server/product-detail.test.js server/inventory.test.js server/inventory-scenarios.test.js server/inventory-adjustments.test.js server/firestore-preview-checkout.test.js server/factory-inventory-api.test.js server/rate-limit.test.js
      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Firestore emulator integration tests (local emulator only, no credentials)
        run: >
          npx --yes firebase-tools@13.35.1 emulators:exec --only firestore
          --project demo-ryuge-inventory
          "node --test server/inventory-firestore-emulator.test.js"
